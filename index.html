<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Physics Typography - Matter.js</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <!-- Matter.js Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <!-- شريط التحكم UI -->
  <div class="control-panel">
    <input type="text" id="textInput" value="KINETIC" placeholder="اكتب نصاً..." maxlength="12">
    <button id="spawnBtn">إسقاط النص 🚀</button>
    <button id="explodeBtn">تفجير/تشتيت 💥</button>
    <button id="resetBtn">إعادة ضبط 🔄</button>
  </div>

  <!-- مسرح الفيزياء -->
  <div id="canvas-container"></div>

  <script src="script.js"></script>
</body>
</html>
